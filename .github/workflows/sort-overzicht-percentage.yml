name: Sorteer Odds Analyse overzicht op percentage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sort-overzicht-percentage.yml'

permissions:
  contents: write

jobs:
  sorteer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pas sortering en uitleg aan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_hint='De odd met de meeste groene vinkjes staat bovenaan.'
          new_hint='Gesorteerd op hoogste percentage. Bij gelijke percentages staat de odd met de meeste metingen bovenaan.'
          old_sort="let rows=grouped().sort((a,b)=>b.good-a.good||b.total-a.total||b.score-a.score||a.odd-b.odd);"
          new_sort="let rows=grouped().sort((a,b)=>b.score-a.score||b.total-a.total||b.good-a.good||a.odd-b.odd);"
          if old_hint not in s:
              raise SystemExit('Oude uitleg niet gevonden')
          if old_sort not in s:
              raise SystemExit('Oude sortering niet gevonden')
          s=s.replace(old_hint,new_hint,1).replace(old_sort,new_sort,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          if "const CACHE='odds-vinkjes-v9';" not in w:
              raise SystemExit('Cache v9 niet gevonden')
          sw.write_text(w.replace("const CACHE='odds-vinkjes-v9';","const CACHE='odds-vinkjes-v10';",1),encoding='utf-8')
          PY
      - name: Commit wijziging en verwijder tijdelijke workflow
        run: |
          rm -f .github/workflows/sort-overzicht-percentage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sorteer overzicht op percentage hoog naar laag"
          git push origin HEAD:main
